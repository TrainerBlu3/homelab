pid_filename /run/squid.pid
http_port 3128
cache_effective_user root

# Who may use the proxy: only the internal app network
acl app_net src 172.31.60.3/32

# Allowed destinations (leading dot = domain + all subdomains)
acl allowed_domains dstdomain -n .mangadex.org .weebcentral.com .asurascans.com .raw.githubusercontent.com .objects.githubusercontent.com .release-assets.githubusercontent.com .cdn.jsdelivr.net .objects.githubusercontent.com .github.com   

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !app_net
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access deny all

# Pure filter: no caching, logs to stdout for `docker logs`
cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pinger_enable off
