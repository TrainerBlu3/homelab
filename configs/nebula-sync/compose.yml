services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:v0.11.3
    container_name: nebula-sync
    restart: unless-stopped
    env_file: .env
    environment:
      - FULL_SYNC=true
      - RUN_GRAVITY=true
      - CRON=0 * * * *
      - TZ=America/Vancouver
    labels:
      - diun.watch_repo=true
      - diun.include_tags=^v?\d+\.\d+\.\d+$
      - diun.max_tags=5
networks: {}