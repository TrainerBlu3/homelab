services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366@sha256:1fac27c387dc2ea9949e1a01ad7f6d6de9d72d3988338a95476748e5c45c4582
    container_name: suwayomi
    restart: unless-stopped
    user: 1500:1500
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      - TZ=America/Vancouver
      - AUTH_MODE=ui_login
      - AUTH_USERNAME=trainerblue
      - AUTH_PASSWORD_FILE=/run/secrets/suwayomi_pw
      - WEB_UI_CHANNEL=bundled
      - WEB_UI_UPDATE_INTERVAL=0
      - EXTENSION_STORES=[]
      - FLARESOLVERR_ENABLED=false
      - KCEF_ENABLED=false
    secrets:
      - suwayomi_pw
    volumes:
      - ./data:/home/suwayomi/.local/share/Tachidesk
    ports:
      - 100.91.58.90:4567:4567
    networks:
      - isolated
    dns:
      - 192.0.2.1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - diun.enable=true
secrets:
  suwayomi_pw:
    file: ./secrets/suwayomi_pw
networks:
  isolated:
    name: suwayomi-isolated
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.50.0/24
