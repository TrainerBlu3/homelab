services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366@sha256:1fac27c387dc2ea9949e1a01ad7f6d6de9d72d3988338a95476748e5c45c4582
    container_name: suwayomi
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,exec   
    user: 1500:1500
    environment:
      - BIND_PORT=4567
      - TZ=America/Vancouver
      - AUTH_MODE=ui_login
      - AUTH_USERNAME=trainerblue
      - AUTH_PASSWORD_FILE=/run/secrets/suwayomi_pw
      - WEB_UI_CHANNEL=bundled
      - WEB_UI_UPDATE_INTERVAL=0
      - EXTENSION_STORES=[]
      - FLARESOLVERR_ENABLED=false
      - KCEF_ENABLED=false
      - JAVA_TOOL_OPTIONS=-Dhttp.proxyHost=egress-proxy -Dhttp.proxyPort=3128
        -Dhttps.proxyHost=egress-proxy -Dhttps.proxyPort=3128
        -Dhttp.nonProxyHosts=localhost|127.0.0.1
    secrets:
      - suwayomi_pw
    volumes:
      - ./data:/home/suwayomi/.local/share/Tachidesk
    networks:
      app-internal:
        ipv4_address: 172.31.60.3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - diun.watch_repo=true
      - diun.include_tags=^v\d+\.\d+\.\d+$
      - diun.max_tags=5
secrets:
  suwayomi_pw:
    file: ./secrets/suwayomi_pw
networks:
  app-internal:
    name: app-internal
    external: true
